---
# Setup macOS defaults to configure most of OS level configurations
configure_osx: true

# Set to true to enable setting the hostname for the machine
configure_hostname: true

# Set to true to run mackup tasks for preferences and settings backup/restore
configure_mackup: true

# Set to true to run ohmyzsh installation
configure_ohmyzsh: true

# Set to 'true' to configure the Dock via dockutil.
configure_dock: true
dockitems_remove:
- Launchpad
- Maps
- FaceTime
- Contacts
- Notes
- Freeform
- TV
- News
- Numbers
- Keynote
- Pages
- 'App Store'
- 'System Settings'
dockitems_persist:
- name: "Music"
  path: "/System/Applications/Music.app/"
  pos: 1
- name: "Podcast"
  path: "/System/Applications/Podcasts.app/"
  pos: 2
- name: "Books"
  path: "/System/Applications/Books.app/"
  pos: 3
- name: "Photos"
  path: "/System/Applications/Photos.app/"
  pos: 4
- name: "Shortcuts"
  path: "/System/Applications/Shortcuts.app/"
  pos: 5
- name: "Safari"
  path: "/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app/"
  pos: 6
- name: "Google Chrome"
  path: "/Applications/Google Chrome.app/"
  pos: 7
- name: "Arc"
  path: "/Applications/Arc.app/"
  pos: 8
- name: "Mail"
  path: "/System/Applications/Mail.app/"
  pos: 9
- name: "Calendar"
  path: "/System/Applications/Calendar.app/"
  pos: 10
- name: "zoom.us"
  path: "/Applications/zoom.us.app/"
  pos: 11
- name: "Slack"
  path: "/Applications/Slack.app/"
  pos: 12
- name: "Discord"
  path: "/Applications/Discord.app/"
  pos: 13
- name: "Messages"
  path: "/System/Applications/Messages.app/"
  pos: 14
- name: "TickTick"
  path: "/Applications/TickTick.app/"
  pos: 15
- name: "Obsidian"
  path: "/Applications/Obsidian.app/"
  pos: 16
- name: "Visual Studio Code"
  path: "/Applications/Visual Studio Code.app/"
  pos: 17
- name: "Terminal"
  path: "/System/Applications/Utilities/Terminal.app/"
  pos: 18
- name: "Applications"
  path: "/Applications/"
  section: others
  display: folder
  view: grid
  pos: 1
- name: "Downloads"
  path: "{{ ansible_env.HOME }}/Downloads"
  section: others
  display: folder
  view: list
  pos: 2

# Install dotfiles from designated repo
configure_dotfiles: false
dotfiles_repo: https://github.com/geerlingguy/dotfiles.git
dotfiles_repo_accept_hostkey: true
dotfiles_repo_local_destination: ~/Development/GitHub/dotfiles
dotfiles_files:
  - .zshrc
  - .osx
  - .gitignore

# Install core homebrew packages (formulae)
configure_homebrew: true
homebrew_packages:
