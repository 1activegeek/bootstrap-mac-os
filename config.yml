  - age
  # - ansible # listing here for reference, but should be installed in bootstrap.sh
  - awscli
  - duti
  - helm
  - k9s
  - kube-ps1
  - kubectx
  - kubernetes-cli
  - mackup
  - neofetch
  - pinentry-mac #for use with homebrew/autoupdate
  - pygments
  - switchaudio-osx
  - terraform
  - tmux
  - watch
  # # used for home-ops setup
